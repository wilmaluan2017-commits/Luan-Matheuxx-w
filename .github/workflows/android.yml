name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find Gradlew and Build APK
      run: |
        GRADLEW_PATH=$(find . -name gradlew -print -quit)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Erro crítico: O arquivo gradlew nao existe no seu repositorio!"
          exit 1
        fi
        
        GRADLE_DIR=$(dirname "$GRADLEW_PATH")
        echo "Gradle encontrado em: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftTotal-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk

