name: Build APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        elif [ -f "MinecraftTotal/gradlew" ]; then
          cd MinecraftTotal && chmod +x gradlew
        elif [ -f "MinecraftTotal (1)/gradlew" ]; then
          cd "MinecraftTotal (1)" && chmod +x gradlew
        fi

    - name: Build with Gradle
      run: |
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        elif [ -f "MinecraftTotal/gradlew" ]; then
          cd MinecraftTotal && ./gradlew assembleDebug
        elif [ -f "MinecraftTotal (1)/gradlew" ]; then
          cd "MinecraftTotal (1)" && ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftTotal-debug-apk
        path: |
          **/build/outputs/apk/debug/*.apk
